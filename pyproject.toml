[project]
name = "dt-roadmap-rag"
version = "1.1.0"
description = "Multi-agent, multi-LLM RAG that turns a free-text business case into a digital transformation roadmap"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.1",
    "pydantic>=2.7",
    "pypdf>=4.2.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.3",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26",
    "google-genai>=1.0",
    "streamlit>=1.46",
    "pandas>=2.2",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "requests>=2.31",
    "tqdm>=4.66",
    "tenacity>=8.3",
    "langgraph>=1.2.14",
    "langchain-core>=1.6.9",
    "langchain-google-genai>=4.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "interrogate>=1.7",
    "mypy>=1.10",
    "pandas-stubs",
    "types-requests",
]

# Not an installable package: modules are imported from the repo root (src.*, app.*, api.*).
[tool.uv]
package = false

# CPU-only torch on Linux (CI, Docker, Hugging Face Spaces): ~200 MB instead of ~2 GB of CUDA wheels.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".venv*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]
# Long lines are prompt text and UI copy; leave them readable.
ignore = [
    "E501",
    "D100", "D104",  # package __init__ and module docstrings are enforced by interrogate
    "D203", "D213",  # conflict with the chosen google convention
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.interrogate]
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = true
fail-under = 90
exclude = ["tests", ".venv", ".agent-scratch", "vector_store", "data"]
verbose = 1

[tool.mypy]
python_version = "3.10"
files = ["src", "api", "app", "scripts"]
ignore_missing_imports = true
warn_unused_ignores = true
explicit_package_bases = true
mypy_path = "."
exclude = ["tests/"]
