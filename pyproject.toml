[project]
name = "dt-roadmap-rag"
version = "1.1.0"
description = "Multi-agent, multi-LLM RAG that turns a free-text business case into a digital transformation roadmap"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.1",
    "pydantic>=2.7",
    "pypdf>=4.2.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.3",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26",
    "google-genai>=1.0",
    "streamlit>=1.36",
    "pandas>=2.2",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "requests>=2.31",
    "tqdm>=4.66",
    "tenacity>=8.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

# Not an installable package: modules are imported from the repo root (src.*, app.*, api.*).
[tool.uv]
package = false

# CPU-only torch on Linux (CI, Docker, Hugging Face Spaces): ~200 MB instead of ~2 GB of CUDA wheels.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".venv*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# Long lines are prompt text and UI copy; leave them readable.
ignore = ["E501"]
